name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ms-digitalfix-bff, ms-digitalfix-workorders, ms-digitalfix-catalog, ms-digitalfix-notify, ms-digitalfix-audit, ms-digitalfix-report]
    defaults:
      run:
        working-directory: backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar tests (Maven)
        run: ./mvnw -q -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/digitalfix-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/digitalfix-react/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar frontend React
        run: npm run build