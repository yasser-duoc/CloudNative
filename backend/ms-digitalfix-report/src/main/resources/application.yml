server:
  port: 8085

spring:
  application:
    name: ms-digitalfix-report
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/digitalfix}
    username: ${POSTGRES_USER:digitalfix}
    password: ${POSTGRES_PASSWORD:digitalfix}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-digitalfix-report
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.digitalfix.report.domain.WorkOrderEvent
management:
  endpoints:
    web:
      exposure:
        include: health,info
