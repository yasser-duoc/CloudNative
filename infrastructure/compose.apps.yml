services:
  digitalfix-react:
    build:
      context: ../frontend/digitalfix-react
    ports:
      - "3000:80"
    depends_on:
      - ms-digitalfix-bff
    restart: unless-stopped
    networks:
      - digitalfix-net

  ms-digitalfix-bff:
    build:
      context: ../backend/ms-digitalfix-bff
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      WORKORDERS_SERVICE_URL: http://ms-digitalfix-workorders:8081
      CATALOG_SERVICE_URL: http://ms-digitalfix-catalog:8082
      NOTIFY_SERVICE_URL: http://ms-digitalfix-notify:8083
      AUDIT_SERVICE_URL: http://ms-digitalfix-audit:8084
      REPORT_SERVICE_URL: http://ms-digitalfix-report:8085
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - digitalfix-net

  ms-digitalfix-workorders:
    build:
      context: ../backend/ms-digitalfix-workorders
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/digitalfix
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-digitalfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfix}
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - digitalfix-net

  ms-digitalfix-catalog:
    build:
      context: ../backend/ms-digitalfix-catalog
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/digitalfix
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-digitalfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfix}
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - digitalfix-net

  ms-digitalfix-notify:
    build:
      context: ../backend/ms-digitalfix-notify
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - digitalfix-net

  ms-digitalfix-audit:
    build:
      context: ../backend/ms-digitalfix-audit
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/digitalfix
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-digitalfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfix}
    ports:
      - "8084:8084"
    restart: unless-stopped
    networks:
      - digitalfix-net

  ms-digitalfix-report:
    build:
      context: ../backend/ms-digitalfix-report
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/digitalfix
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-digitalfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfix}
    ports:
      - "8085:8085"
    restart: unless-stopped
    networks:
      - digitalfix-net

networks:
  digitalfix-net:
    external: true
