services:
  rabbitmq-1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-digitalfix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-digitalfix}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-digitalfix-cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - digitalfix-net

  rabbitmq-2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-digitalfix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-digitalfix}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-digitalfix-cookie}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1
    command: >
      sh -c "sleep 15 &&
             rabbitmqctl stop_app &&
             rabbitmqctl reset &&
             rabbitmqctl join_cluster rabbit@rabbitmq-1 &&
             rabbitmqctl start_app"
    restart: unless-stopped
    networks:
      - digitalfix-net

volumes:
  rabbitmq1-data:
  rabbitmq2-data:

networks:
  digitalfix-net:
    external: true
