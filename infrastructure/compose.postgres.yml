services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalfix-postgres
    environment:
      POSTGRES_DB: digitalfix
      POSTGRES_USER: ${POSTGRES_USER:-digitalfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfix}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    ports:
      - "5432:5432"
    mem_limit: 384m
    mem_reservation: 192m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digitalfix} -d digitalfix"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - digitalfix-net

volumes:
  postgres-data:

networks:
  digitalfix-net:
    external: true