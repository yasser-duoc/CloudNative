# ============================================================
#  Kafka 4.x con KRaft (sin ZooKeeper)
#
#  Un solo nodo con ambos roles (broker,controller), ideal para
#  laboratorio. Kafka 4.0 elimino ZooKeeper: el consenso lo
#  gestiona KRaft internamente (los compose con zookeeper+kafka
#  estan obsoletos y no son compatibles con apache/kafka:4.x).
#
#  KAFKA_ADVERTISED_HOST: en local deja el default (localhost);
#  en EC2 debe ser la IP publica de la instancia (el user-data.sh
#  la obtiene via IMDSv2 y la exporta).
#
#  La UI de administracion va en compose.kafka-ui.yml (separada).
# ============================================================

services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft (un nodo: broker + controller) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      # --- Listeners ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092

      # --- Replicacion (un solo nodo) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Almacenamiento ---
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Heap acotado para instancias pequenas
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 768m
    mem_reservation: 384m
    restart: unless-stopped
    networks:
      - digitalfix-net

volumes:
  kafka_data:

networks:
  digitalfix-net:
    external: true

