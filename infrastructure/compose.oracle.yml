services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-pedidos360}
      APP_USER: ${ORACLE_USERNAME:-pedidos360}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-pedidos360}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - pedidos360-net

volumes:
  oracle-data:

networks:
  pedidos360-net:
    external: true
